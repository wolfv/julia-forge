name: Build all packages

# required for prefix.dev trusted publishing (OIDC) on the upload steps
permissions:
  id-token: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:

  build:
    strategy:
      matrix:
        include:
          - { target: linux-64,      os: ubuntu-22.04 }
          - { target: linux-aarch64, os: ubuntu-24.04-arm }
          - { target: win-64,        os: windows-latest }
          - { target: osx-arm64,     os: macos-latest }
      fail-fast: false

    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 2
    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: v0.70.1
        cache: true

    - name: Add .pixi/envs/default to the $PATH
      shell: bash
      run: |
        echo "$(pwd)/.pixi/envs/default/bin" >> $GITHUB_PATH

    # julia/ (tracks juliaup "release") and julia-lts/ (tracks juliaup "lts")
    # both produce a package literally named `julia`, so each is built and
    # uploaded to its own channel rather than merged into one output dir.
    - name: Build release recipe (julia-forge)
      shell: bash
      env:
        TARGET_PLATFORM: ${{ matrix.target }}
      run: |
        rattler-build build --recipe-dir julia \
          --skip-existing=all --target-platform=$TARGET_PLATFORM \
          -c conda-forge -c https://prefix.dev/julia-forge \
          --output-dir output-release

    # lts builds are also uploaded to julia-forge (so users can get an lts
    # build there via a plain version pin, e.g. julia=1.10.*, without adding
    # a second channel) -- skip-existing checks julia-forge, not
    # julia-forge-lts, since --skip-existing=all skips if a match is found
    # in *any* listed channel and julia-forge is the one that needs the new
    # version to actually show up before this can be skipped safely
    - name: Build lts recipe (julia-forge-lts)
      shell: bash
      env:
        TARGET_PLATFORM: ${{ matrix.target }}
      run: |
        rattler-build build --recipe-dir julia-lts \
          --skip-existing=all --target-platform=$TARGET_PLATFORM \
          -c conda-forge -c https://prefix.dev/julia-forge \
          --output-dir output-lts

    - name: Build precompiled Julia example application
      shell: bash
      env:
        TARGET_PLATFORM: ${{ matrix.target }}
      run: |
        rattler-build build --recipe-dir julia-forge-example \
          --skip-existing=all --target-platform=$TARGET_PLATFORM \
          -c https://prefix.dev/julia-forge -c conda-forge \
          --output-dir output-example

    - name: Upload release packages
      shell: bash
      # do not upload on PR; allow manual re-trigger via workflow_dispatch
      # uses prefix.dev trusted publishing (OIDC) via the id-token permission
      # above -- no PREFIX_API_KEY needed; julia-forge must list this repo
      # and workflow under its "Trusted Publishers" settings on prefix.dev
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: |
        shopt -s nullglob
        exit_code=0
        for file in output-release/**/*.conda; do
          rattler-build upload prefix -c julia-forge "$file" || exit_code=1
        done
        exit $exit_code

    - name: Upload example application
      shell: bash
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: |
        shopt -s nullglob
        exit_code=0
        for file in output-example/**/*.conda; do
          rattler-build upload prefix -c julia-forge "$file" || exit_code=1
        done
        exit $exit_code

    - name: Upload lts packages
      shell: bash
      # do not upload on PR; allow manual re-trigger via workflow_dispatch
      # uses prefix.dev trusted publishing (OIDC) via the id-token permission
      # above -- no PREFIX_API_KEY needed; both julia-forge-lts and
      # julia-forge must list this repo and workflow under their
      # "Trusted Publishers" settings on prefix.dev
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      run: |
        shopt -s nullglob
        exit_code=0
        for file in output-lts/**/*.conda; do
          # julia-forge-lts is only reached here (rather than being skipped
          # at build time) while backfilling julia-forge with a version it
          # already has, so an "already exists" conflict here is expected
          # and not a real failure
          rattler-build upload prefix -c julia-forge-lts "$file" || true
          rattler-build upload prefix -c julia-forge "$file" || exit_code=1
        done
        exit $exit_code
