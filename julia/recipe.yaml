context:
  version: 1.13.2

package:
  name: julia
  version: ${{ version }}

source:
  - if: osx and arm64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/aarch64/1.13/julia-1.13.2-macaarch64.tar.gz
        sha256: 63309775ab65021036b0b4a069e82ae004a3f2b551fc10ceb40ddb2203200387
  - if: osx and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/x64/1.13/julia-1.13.2-mac64.tar.gz
        sha256: e5f224b07fc2ae2144391416542da3f710a9671d35b856d92ad355a19b0bfe86
  - if: linux and aarch64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.13/julia-1.13.2-linux-aarch64.tar.gz
        sha256: b366ac62162d42b272e82436397487dec719f0830d059cdd8a3f7a1810647128
  - if: linux and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/x64/1.13/julia-1.13.2-linux-x86_64.tar.gz
        sha256: 2ecdfc9890ab0a565fdd92404c915ba2a04a933dbd5d292cc224d13819d17d07
  - if: win and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/winnt/x64/1.13/julia-1.13.2-win64.tar.gz
        sha256: 1445412ddc4ee2096fac09c74f6f5b3b35705d16a45270b4bbde6e4631e455ca

build:
  script:
    - if: unix
      then:
        - cp -r $SRC_DIR/* $PREFIX/
        - rm -rf $PREFIX/LICENSE.md
    - if: win
      then:
        - robocopy %SRC_DIR% %LIBRARY_PREFIX% /E & if %ERRORLEVEL% LEQ 7 (verify>nul) else (exit /b %ERRORLEVEL%)
        - del /F /Q %LIBRARY_PREFIX%\LICENSE.md

  dynamic_linking:
    binary_relocation: false

tests:
  - script:
      - julia -e "println(1+1)"
      - julia --help

about:
  homepage: https://julialang.org/
  license: MIT
  summary: Julia is a high-level, high-performance dynamic programming language for technical computing.
  description: |
    This is the official Julia binary distribution, repackaged as a conda
    package with no modifications. Version tracking is driven by juliaup
    (https://github.com/JuliaLang/juliaup): this build follows juliaup's
    "release" channel, which always points to the latest stable Julia
    release, and is published to the julia-forge prefix.dev channel. For
    juliaup's "lts" channel instead, see the julia-forge-lts channel.
  license_file: LICENSE.md