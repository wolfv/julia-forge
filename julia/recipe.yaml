context:
  version: 1.12.7

package:
  name: julia
  version: ${{ version }}

source:
  - if: osx and arm64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/aarch64/1.12/julia-1.12.7-macaarch64.tar.gz
        sha256: af8fcedfb25b6b9c8c13d99695c38faa2d59bf0162b3f458c8b8b56f14c96919
  - if: osx and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/x64/1.12/julia-1.12.7-mac64.tar.gz
        sha256: a21a15c7b7d294a03482a3598b18cde48d37be86ac7a408e495e51fb3afe0157
  - if: linux and aarch64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.12/julia-1.12.7-linux-aarch64.tar.gz
        sha256: 9243c0b524c7f300883240a1ee5ea3916a30e070bff718acf8ccaee31a731ef2
  - if: linux and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/x64/1.12/julia-1.12.7-linux-x86_64.tar.gz
        sha256: 4e7e9e776634d24835250de67cde39b0d4af15bc432eb20697e6be6c28ea69e8
  - if: win and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/winnt/x64/1.12/julia-1.12.7-win64.tar.gz
        sha256: c374f00e8cf257515e10133829f05d39ce3411b46131ba6a9f3cbfb5e247cd71

build:
  script:
    - if: unix
      then:
        - cp -r $SRC_DIR/* $PREFIX/
        - rm -rf $PREFIX/LICENSE.md
    - if: win
      then:
        - robocopy %SRC_DIR% %LIBRARY_PREFIX% /E & if %ERRORLEVEL% LEQ 7 (verify>nul) else (exit /b %ERRORLEVEL%)
        - del /F /Q %LIBRARY_PREFIX%\LICENSE.md

  dynamic_linking:
    binary_relocation: false

tests:
  - script:
      - julia -e "println(1+1)"
      - julia --help

about:
  homepage: https://julialang.org/
  license: MIT
  summary: Julia is a high-level, high-performance dynamic programming language for technical computing.
  description: |
    This is the official Julia binary distribution, repackaged as a conda
    package with no modifications. Version tracking is driven by juliaup
    (https://github.com/JuliaLang/juliaup): this build follows juliaup's
    "release" channel, which always points to the latest stable Julia
    release, and is published to the julia-forge prefix.dev channel. For
    juliaup's "lts" channel instead, see the julia-forge-lts channel.
  license_file: LICENSE.md