context:
  version: 1.13.1

package:
  name: julia
  version: ${{ version }}

source:
  - if: osx and arm64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/aarch64/1.13/julia-1.13.1-macaarch64.tar.gz
        sha256: a3e0259d4777c2b776c2cba134d5b6c6c124048dcb913f8881517892c49a0f7f
  - if: osx and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/x64/1.13/julia-1.13.1-mac64.tar.gz
        sha256: 3e1930346b14443d9b7a63a0290158c030364efcfc352c9c01e9ddd64f03307d
  - if: linux and aarch64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.13/julia-1.13.1-linux-aarch64.tar.gz
        sha256: 78341862e24734ea1c2fa8795183c52627c23a99aba5aa1d0ec840edecec5ce0
  - if: linux and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/x64/1.13/julia-1.13.1-linux-x86_64.tar.gz
        sha256: 0f2e18c8dea60a2c8711d089cd9612f7a8df394b89e5208096fe5867647e0908
  - if: win and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/winnt/x64/1.13/julia-1.13.1-win64.tar.gz
        sha256: 06d950b97fc99b518d11b0f53c0172bdb762a9309c8bfc8210e50cb47c83af22

build:
  script:
    - if: unix
      then:
        - cp -r $SRC_DIR/* $PREFIX/
        - rm -rf $PREFIX/LICENSE.md
    - if: win
      then:
        - robocopy %SRC_DIR% %LIBRARY_PREFIX% /E & if %ERRORLEVEL% LEQ 7 (verify>nul) else (exit /b %ERRORLEVEL%)
        - del /F /Q %LIBRARY_PREFIX%\LICENSE.md

  dynamic_linking:
    binary_relocation: false

tests:
  - script:
      - julia -e "println(1+1)"
      - julia --help

about:
  homepage: https://julialang.org/
  license: MIT
  summary: Julia is a high-level, high-performance dynamic programming language for technical computing.
  description: |
    This is the official Julia binary distribution, repackaged as a conda
    package with no modifications. Version tracking is driven by juliaup
    (https://github.com/JuliaLang/juliaup): this build follows juliaup's
    "release" channel, which always points to the latest stable Julia
    release, and is published to the julia-forge prefix.dev channel. For
    juliaup's "lts" channel instead, see the julia-forge-lts channel.
  license_file: LICENSE.md