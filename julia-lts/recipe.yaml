context:
  version: 1.10.14

package:
  name: julia
  version: ${{ version }}

source:
  - if: osx and arm64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/aarch64/1.10/julia-1.10.14-macaarch64.tar.gz
        sha256: 8af0c58233c056faa4ea220f335e3c9776b2d5b41957d82c1718e41c45a655d5
  - if: osx and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/x64/1.10/julia-1.10.14-mac64.tar.gz
        sha256: 8cc328f0e10762cd0534f519b2b47cd7dc116963208e2838c85589e248092865
  - if: linux and aarch64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.10/julia-1.10.14-linux-aarch64.tar.gz
        sha256: 7bdd277c5c4a6069a35f303b0944e374908ccc9ff4cfb5df1478a047120264a8
  - if: linux and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-1.10.14-linux-x86_64.tar.gz
        sha256: 6fd79bad660a4e34205da931bdd3afc6d86613a8189b76acecb26e6f06a67386
  - if: win and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/winnt/x64/1.10/julia-1.10.14-win64.tar.gz
        sha256: 9720389885b57675f34084ae5049250769d5d6ac020fdff4979dcb5b7a4265f7

build:
  script:
    - if: unix
      then:
        - cp -r $SRC_DIR/* $PREFIX/
        - rm -rf $PREFIX/LICENSE.md
    - if: win
      then:
        - robocopy %SRC_DIR% %LIBRARY_PREFIX% /E & if %ERRORLEVEL% LEQ 7 (verify>nul) else (exit /b %ERRORLEVEL%)
        - del /F /Q %LIBRARY_PREFIX%\LICENSE.md

  dynamic_linking:
    binary_relocation: false

tests:
  - script:
      - julia -e "println(1+1)"
      - julia --help

about:
  homepage: https://julialang.org/
  license: MIT
  summary: Julia is a high-level, high-performance dynamic programming language for technical computing. This build tracks the juliaup "lts" channel and is published to the julia-forge-lts prefix.dev channel (as opposed to julia-forge, which tracks "release").
  description: |
    This is the official Julia binary distribution, repackaged as a conda
    package with no modifications. Version tracking is driven by juliaup
    (https://github.com/JuliaLang/juliaup): this build follows juliaup's
    "lts" channel, which always points to the latest long-term-support
    Julia release, and is published to the julia-forge-lts prefix.dev
    channel. For juliaup's "release" channel instead, see the julia-forge
    channel.
  license_file: LICENSE.md