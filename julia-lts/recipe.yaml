context:
  version: 1.10.13

package:
  name: julia
  version: ${{ version }}

source:
  - if: osx and arm64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/aarch64/1.10/julia-1.10.13-macaarch64.tar.gz
        sha256: c93af6e5fa5def588a3d441156c2dc721b7621edaaea78e7ef7197daaadca560
  - if: osx and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/x64/1.10/julia-1.10.13-mac64.tar.gz
        sha256: 4b3576e0b15b3ba6baa8b3574948af6045c9fa8cdac593e7b3bae68f0553574a
  - if: linux and aarch64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.10/julia-1.10.13-linux-aarch64.tar.gz
        sha256: f21192227b84236803e64e1fe2434c4c92975e3ce5a0cc28edfa50fbbcf1d748
  - if: linux and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-1.10.13-linux-x86_64.tar.gz
        sha256: f2bfa080db29b50a9bf250f69e9acdcfd8b7c49409dee5e55588f986706fb8bd
  - if: win and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/winnt/x64/1.10/julia-1.10.13-win64.tar.gz
        sha256: 0534389961e73f7894e29ff7e6237f30ef33351fb76a24e1076f07cf6fbaaa91

build:
  script:
    - if: unix
      then:
        - cp -r $SRC_DIR/* $PREFIX/
        - rm -rf $PREFIX/LICENSE.md
    - if: win
      then:
        - robocopy %SRC_DIR% %LIBRARY_PREFIX% /E & if %ERRORLEVEL% LEQ 7 (verify>nul) else (exit /b %ERRORLEVEL%)
        - del /F /Q %LIBRARY_PREFIX%\LICENSE.md

  dynamic_linking:
    binary_relocation: false

tests:
  - script:
      - julia -e "println(1+1)"
      - julia --help

about:
  homepage: https://julialang.org/
  license: MIT
  summary: Julia is a high-level, high-performance dynamic programming language for technical computing. This build tracks the juliaup "lts" channel and is published to the julia-forge-lts prefix.dev channel (as opposed to julia-forge, which tracks "release").
  description: |
    This is the official Julia binary distribution, repackaged as a conda
    package with no modifications. Version tracking is driven by juliaup
    (https://github.com/JuliaLang/juliaup): this build follows juliaup's
    "lts" channel, which always points to the latest long-term-support
    Julia release, and is published to the julia-forge-lts prefix.dev
    channel. For juliaup's "release" channel instead, see the julia-forge
    channel.
  license_file: LICENSE.md