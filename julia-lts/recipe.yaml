context:
  version: 1.10.12

package:
  name: julia
  version: ${{ version }}

source:
  - if: osx and arm64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/aarch64/1.10/julia-1.10.12-macaarch64.tar.gz
        sha256: 53b12aee2a20d56d498589d21ab7f5f848bda0bbd75afdc5d94fe8876dab783f
  - if: osx and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/mac/x64/1.10/julia-1.10.12-mac64.tar.gz
        sha256: 5af0ae55525323db4d9e26706dd3bd39d60ae6f8d0e88481223155c78b4ec118
  - if: linux and aarch64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/aarch64/1.10/julia-1.10.12-linux-aarch64.tar.gz
        sha256: cc257b21967049642bfe17de1aff7dae17477eba4f423f98cb400c002080e5a2
  - if: linux and ppc64le
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/ppc64le/1.10/julia-1.10.11-linux-ppc64le.tar.gz
        sha256: 2dee344a4de2a1f0ef3ac715dcf8c7d2a77466f120ad8065d06f688ea9f595d9
  - if: linux and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/linux/x64/1.10/julia-1.10.12-linux-x86_64.tar.gz
        sha256: b0c50dfe349d76ffc8580d24e0c0be623988a6d91ed57ad8b73c0137fd27bc0d
  - if: win and x86_64
    then:
      - url: https://julialang-s3.julialang.org/bin/winnt/x64/1.10/julia-1.10.12-win64.tar.gz
        sha256: 5b82ac507e0e90313eaf00a7a6e6f9566049b03b3ae1491f42d38c78ef950c98

build:
  script:
    - if: unix
      then:
        - cp -r $SRC_DIR/* $PREFIX/
        - rm -rf $PREFIX/LICENSE.md
    - if: win
      then:
        - robocopy %SRC_DIR% %LIBRARY_PREFIX% /E & if %ERRORLEVEL% LEQ 7 (verify>nul) else (exit /b %ERRORLEVEL%)
        - del /F /Q %LIBRARY_PREFIX%\LICENSE.md

  dynamic_linking:
    binary_relocation: false

tests:
  - script:
      - julia -e "println(1+1)"
      - julia --help

about:
  homepage: https://julialang.org/
  license: MIT
  summary: Julia is a high-level, high-performance dynamic programming language for technical computing. This build tracks the juliaup "lts" channel and is published to the julia-forge-lts prefix.dev channel (as opposed to julia-forge, which tracks "release").
  description: |
    This is the official Julia binary distribution, repackaged as a conda
    package with no modifications. Version tracking is driven by juliaup
    (https://github.com/JuliaLang/juliaup): this build follows juliaup's
    "lts" channel, which always points to the latest long-term-support
    Julia release, and is published to the julia-forge-lts prefix.dev
    channel. For juliaup's "release" channel instead, see the julia-forge
    channel.
  license_file: LICENSE.md